<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f7f8fd" />
    <title>P34k</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f7f8fd;
      }

      #startup-shell {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f8fd;
        z-index: 9999;
        transition: opacity 160ms ease-out;
      }

      #startup-shell[data-hidden='true'] {
        opacity: 0;
        pointer-events: none;
      }

      /* Shown only by the failsafe below, and only when the app never mounted:
         hiding the shell then would otherwise reveal an empty page. */
      #startup-shell-failed {
        display: none;
        max-width: 18rem;
        padding: 0 1rem;
        text-align: center;
        font-family: Manrope, system-ui, sans-serif;
        color: #1c1c28;
      }

      #startup-shell[data-failed='true'] #startup-shell-spinner {
        display: none;
      }

      #startup-shell[data-failed='true'] #startup-shell-failed {
        display: block;
      }

      #startup-shell-failed button {
        margin-top: 1rem;
        padding: 0.625rem 1.25rem;
        border: 0;
        border-radius: 9999px;
        background: #3447f3;
        color: #fff;
        font: inherit;
        font-weight: 600;
      }

      #startup-shell-spinner {
        width: 32px;
        height: 32px;
        border: 2px solid #3447f3;
        border-top-color: transparent;
        border-radius: 9999px;
        animation: startup-spin 0.8s linear infinite;
      }

      @keyframes startup-spin {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-shell" aria-hidden="true">
      <div id="startup-shell-spinner"></div>
      <div id="startup-shell-failed">
        <p>P34k didn’t start. Check your connection and try again.</p>
        <button type="button" onclick="window.location.reload()">Reload</button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Failsafe: stop covering the page even if the app never mounts.
      //
      // Every other way this splash comes down runs inside React. That is no
      // help in the failure this app has actually shipped twice — a build
      // whose entry chunk cannot load — because then no React code runs at
      // all and the user is left on an opaque spinner forever, with nothing
      // on screen to report and no way to reach the app underneath.
      //
      // Deliberately long: 15s is well past a cold start on a slow mobile
      // connection, so a merely slow launch is never cut short.
      //
      // Which of the two things it does depends on whether React got as far as
      // rendering. If #root has content, the app is alive and merely slow --
      // possibly sitting on an auth step that holds the splash on purpose --
      // so the shell just goes transparent and click-through and the app shows
      // through. If #root is still empty the app never mounted, and hiding the
      // shell would reveal a blank page; that case gets a message and a reload
      // button instead, which is the whole point of catching it.
      //
      // Inline and above the module script on purpose: it must survive the
      // very failure it exists for, so it cannot live in a bundle.
      window.setTimeout(function () {
        var shell = document.getElementById('startup-shell');
        if (!shell) {
          return;
        }
        var root = document.getElementById('root');
        if (root && root.childElementCount > 0) {
          shell.setAttribute('data-hidden', 'true');
        } else {
          shell.setAttribute('data-failed', 'true');
        }
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
